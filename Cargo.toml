[workspace]
resolver = "2"
members = ["crates/carrick-core", "crates/carrick-cli", "crates/carrick-gui"]

[workspace.package]
version = "0.1.7"
edition = "2021"
rust-version = "1.91"
publish = false
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
debug = "none"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
