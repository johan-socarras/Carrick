[package]
name = "carrick-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
blake3 = "1.8.7"
bytes = "1.12.2"
data-encoding = "2.11.1"
directories = "6.0.0"
filetime = "0.2.30"
fs4 = "1.1.0"
hex = "0.4.3"
iroh = "1.5"
iroh-blobs = "0.105"
iroh-relay = { version = "1.5", default-features = false }
n0-future = "0.3.2"
notify-rust = "4.19.0"
postcard = { version = "1.2.0", features = ["alloc", "use-std"] }
rustls-pki-types = "1"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
walkdir = "2.5.1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }
